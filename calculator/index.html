document.addEventListener('DOMContentLoaded', async function() {

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4425;\n  --barro-700: #743620;\n  --barro-800: #562A1B;\n  --barro-900: #3A1E14;\n\n  /* ---- Toronja (accent — citrus amber / grapefruit grove) ---- */\n  --toronja-50:  #FDF3E2;\n  --toronja-100: #FAE2BC;\n  --toronja-200: #F5C778;\n  --toronja-300: #EFAB3D;\n  --toronja-400: #E5912A;\n  --toronja-500: #CE7714;\n  --toronja-600: #A65D0F;\n  --toronja-700: #80470E;\n  --toronja-800: #5C340D;\n  --toronja-900: #3D230A;\n\n  /* ---- Resaca (water — oxbow lakes & the Rio) ---- */\n  --resaca-50:  #E8F2F4;\n  --resaca-100: #C8E0E6;\n  --resaca-200: #95C3CE;\n  --resaca-300: #5DA0B1;\n  --resaca-400: #357F93;\n  --resaca-500: #226578;\n  --resaca-600: #1A5061;\n  --resaca-700: #163F4C;\n  --resaca-800: #122F39;\n  --resaca-900: #0D2128;\n\n  /* ---- Arena (neutral — warm sand & shade) ---- */\n  --arena-0:   #FFFFFF;\n  --arena-50:  #FAF7F1;\n  --arena-100: #F2ECE1;\n  --arena-200: #E5DBCB;\n  --arena-300: #D2C5AF;\n  --arena-400: #AB9F8A;\n  --arena-500: #7E7563;\n  --arena-600: #5D5648;\n  --arena-700: #433D31;\n  --arena-800: #2B271E;\n  --arena-900: #1A1711;\n\n  /* ---- Raw semantic hues ---- */\n  --green:  var(--verde-500);\n  --amber:  var(--toronja-400);\n  --clay:   var(--barro-500);\n  --blue:   var(--resaca-400);\n  --red:    #C0432B;\n  --red-50: #FBEAE6;\n  --red-700:#7E2A1B;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in components, not raw hues\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page:     var(--arena-50);\n  --surface-card:     var(--arena-0);\n  --surface-sunken:   var(--arena-100);\n  --surface-raised:   var(--arena-0);\n  --surface-inverse:  var(--verde-800);\n  --surface-overlay:  rgba(26, 23, 17, 0.55);\n\n  /* Text */\n  --text-strong:   var(--arena-900);\n  --text-body:     var(--arena-800);\n  --text-muted:    var(--arena-500);\n  --text-subtle:   var(--arena-400);\n  --text-inverse:  var(--arena-50);\n  --text-on-brand: #FFFFFF;\n  --text-link:     var(--verde-600);\n\n  /* Brand */\n  --brand:         var(--verde-600);\n  --brand-hover:   var(--verde-700);\n  --brand-active:  var(--verde-800);\n  --brand-soft:    var(--verde-50);\n  --brand-soft-border: var(--verde-200);\n\n  --accent:        var(--toronja-400);\n  --accent-hover:  var(--toronja-500);\n  --accent-soft:   var(--toronja-50);\n\n  /* Borders & lines */\n  --border-soft:   var(--arena-200);\n  --border:        var(--arena-300);\n  --border-strong: var(--arena-400);\n  --border-brand:  var(--verde-300);\n\n  /* Focus */\n  --focus-ring:    var(--toronja-300);\n\n  /* Status */\n  --success:        var(--verde-500);\n  --success-soft:   var(--verde-50);\n  --warning:        var(--toronja-400);\n  --warning-soft:   var(--toronja-50);\n  --danger:         var(--red);\n  --danger-soft:    var(--red-50);\n  --info:           var(--resaca-400);\n  --info-soft:      var(--resaca-50);\n\n  /* ---- Trail difficulty (domain semantic) ---- */\n  --diff-easy:       var(--verde-500);\n  --diff-easy-soft:  var(--verde-50);\n  --diff-moderate:   var(--toronja-400);\n  --diff-moderate-soft: var(--toronja-50);\n  --diff-hard:       var(--barro-500);\n  --diff-hard-soft:  var(--barro-50);\n  --diff-expert:     var(--arena-900);\n  --diff-expert-soft:var(--arena-200);\n\n  /* ---- Map / terrain fills ---- */\n  --terrain-water:   var(--resaca-200);\n  --terrain-land:    var(--arena-100);\n  --terrain-park:    var(--verde-100);\n  --terrain-trail:   var(--barro-400);\n  --terrain-contour: var(--arena-300);\n}\n<\/style>\n  <style>/* ============================================================\n   SENDERO DESIGN SYSTEM — global entry point\n   Consumers link this single file. Imports only — no rules here.\n   ============================================================ */\n\n/* ============================================================\n   SENDERO — FONTS\n   Loaded from Google Fonts CDN (no local binaries shipped).\n   - Bricolag ) format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"eb4ef5a3-347b-4774-82e9-6406d70f959d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0e2fa260-3601-4c88-891f-a9de739de905\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"53c50301-f1a1-4f04-a4ac-ea490a1c48a0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3e99590d-c8a1-4c4d-b880-e1e8a507a704\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"108d8856-c687-40aa-a39e-10d030f68d03\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"eecfe91e-724a-4d55-95fe-201fad39a85e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   SENDERO — COLOR TOKENS\n   Palette rooted in the Rio Grande Valley: mesquite canopy green,\n   adobe/clay earth, citrus amber, resaca water blue, warm sand.\n   ============================================================ */\n\n:root {\n  /* ---- Verde (primary — mesquite canopy) ---- */\n  --verde-50:  #EDF5F0;\n  --verde-100: #D6E8DD;\n  --verde-200: #AFD2BF;\n  --verde-300: #80B79B;\n  --verde-400: #549A78;\n  --verde-500: #2E7D58;\n  --verde-600: #1F6447;\n  --verde-700: #194F39;\n  --verde-800: #143E2D;\n  --verde-900: #0E2B20;\n\n  /* ---- Barro (secondary — adobe clay / RGV soil) ---- */\n  --barro-50:  #FAEEE7;\n  --barro-100: #F3D9C9;\n  --barro-200: #E6B59A;\n  --barro-300: #D68F6A;\n  --barro-400: #C56F43;\n  --barro-500: #B0572F;\n  --barro-600: #934425;\n  --barro-700: #743620;\n  --barro-800: #562A1B;\n  --barro-900: #3A1E14;\n\n  /* ---- Toronja (accent — citrus amber / grapefruit grove) ---- */\n  --toronja-50:  #FDF3E2;\n  --toronja-100: #FAE2BC;\n  --toronja-200: #F5C778;\n  --toronja-300: #EFAB3D;\n  --toronja-400: #E5912A;\n  --toronja-500: #CE7714;\n  --toronja-600: #A65D0F;\n  --toronja-700: #80470E;\n  --toronja-800: #5C340D;\n  --toronja-900: #3D230A;\n\n  /* ---- Resaca (water — oxbow lakes & the Rio) ---- */\n  --resaca-50:  #E8F2F4;\n  --resaca-100: #C8E0E6;\n  --resaca-200: #95C3CE;\n  --resaca-300: #5DA0B1;\n  --resaca-400: #357F93;\n  --resaca-500: #226578;\n  --resaca-600: #1A5061;\n  --resaca-700: #163F4C;\n  --resaca-800: #122F39;\n  --resaca-900: #0D2128;\n\n  /* ---- Arena (neutral — warm sand & shade) ---- */\n  --arena-0:   #FFFFFF;\n  --arena-50:  #FAF7F1;\n  --arena-100: #F2ECE1;\n  --arena-200: #E5DBCB;\n  --arena-300: #D2C5AF;\n  --arena-400: #AB9F8A;\n  --arena-500: #7E7563;\n  --arena-600: #5D5648;\n  --arena-700: #433D31;\n  --arena-800: #2B271E;\n  --arena-900: #1A1711;\n\n  /* ---- Raw semantic hues ---- */\n  --green:  var(--verde-500);\n  --amber:  var(--toronja-400);\n  --clay:   var(--barro-500);\n  --blue:   var(--resaca-400);\n  --red:    #C0432B;\n  --red-50: #FBEAE6;\n  --red-700:#7E2A1B;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in components, not raw hues\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page:     var(--arena-50);\n  --surface-card:     var(--arena-0);\n  --surface-sunken:   var(--arena-100);\n  --surface-raised:   var(--arena-0);\n  --surface-inverse:  var(--verde-800);\n  --surface-overlay:  rgba(26, 23, 17, 0.55);\n\n  /* Text */\n  --text-strong:   var(--arena-900);\n  --text-body:     var(--arena-800);\n  --text-muted:    var(--arena-500);\n  --text-subtle:   var(--arena-400);\n  --text-inverse:  var(--arena-50);\n  --text-on-brand: #FFFFFF;\n  --text-link:     var(--verde-600);\n\n  /* Brand */\n  --brand:         var(--verde-600);\n  --brand-hover:   var(--verde-700);\n  --brand-active:  var(--verde-800);\n  --brand-soft:    var(--verde-50);\n  --brand-soft-border: var(--verde-200);\n\n  --accent:        var(--toronja-400);\n  --accent-hover:  var(--toronja-500);\n  --accent-soft:   var(--toronja-50);\n\n  /* Borders & lines */\n  --border-soft:   var(--arena-200);\n  --border:        var(--arena-300);\n  --border-strong: var(--arena-400);\n  --border-brand:  var(--verde-300);\n\n  /* Focus */\n  --focus-ring:    var(--toronja-300);\n\n  /* Status */\n  --success:        var(--verde-500);\n  --success-soft:   var(--verde-50);\n  --warning:        var(--toronja-400);\n  --warning-soft:   var(--toronja-50);\n  --danger:         var(--red);\n  --danger-soft:    var(--red-50);\n  --info:           var(--resaca-400);\n  --info-soft:      var(--resaca-50);\n\n  /* ---- Trail difficulty (domain semantic) ---- */\n  --diff-easy:       var(--verde-500);\n  --diff-easy-soft:  var(--verde-50);\n  --diff-moderate:   var(--toronja-400);\n  --diff-moderate-soft: var(--toronja-50);\n  --diff-hard:       var(--barro-500);\n  --diff-hard-soft:  var(--barro-50);\n  --diff-expert:     var(--arena-900);\n  --diff-expert-soft:var(--arena-200);\n\n  /* ---- Map / terrain fills ---- */\n  --terrain-water:   var(--resaca-200);\n  --terrain-land:    var(--arena-100);\n  --terrain-park:    var(--verde-100);\n  --terrain-trail:   var(--barro-400);\n  --terrain-contour: var(--arena-300);\n}\n\n/* ============================================================\n   SENDERO — TYPOGRAPHY TOKENS\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;\n  --font-sans:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;\n  --font-mono:    'Space Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* ---- Weights ---- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extra:    800;\n\n  /* ---- Type scale (rem, 16px base) ---- */\n  --text-2xs:  0.6875rem;  /* 11px — map labels, fine print */\n  --text-xs:   0.75rem;    /* 12px — captions, eyebrows */\n  --text-sm:   0.875rem;   /* 14px — secondary UI */\n  --text-base: 1rem;       /* 16px — body */\n  --text-lg:   1.125rem;   /* 18px — lead body */\n  --text-xl:   1.375rem;   /* 22px — card titles */\n  --text-2xl:  1.75rem;    /* 28px — section heads */\n  --text-3xl:  2.25rem;    /* 36px — page titles */\n  --text-4xl:  3rem;       /* 48px — hero */\n  --text-5xl:  4rem;       /* 64px — display */\n\n  /* ---- Line heights ---- */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-eyebrow:0.14em;  /* uppercase eyebrows / overlines */\n}\n\n/* ============================================================\n   SENDERO — SPACING, RADII, SIZING\n   8px-based rhythm with a couple of half-steps for dense UI.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale ---- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   2.5rem;   /* 40 */\n  --space-8:   3rem;     /* 48 */\n  --space-9:   4rem;     /* 64 */\n  --space-10:  6rem;     /* 96 */\n\n  /* ---- Corner radii (soft, field-guide rounded) ---- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-2xl:  32px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-thin:  1px;\n  --border-base:  1.5px;\n  --border-thick: 2px;\n\n  /* ---- Layout ---- */\n  --container-sm:  640px;\n  --container-md:  860px;\n  --container-lg:  1100px;\n  --app-width:     420px;   /* mobile app frame */\n  --tap-min:       44px;    /* min touch target */\n\n  /* ---- Motion ---- */\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1);   /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);      /* @kind other */\n  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);   /* @kind other */\n  --dur-fast:   120ms;                                /* @kind other */\n  --dur-base:   200ms;                                /* @kind other */\n  --dur-slow:   320ms;                                /* @kind other */\n}\n\n/* ============================================================\n   SENDERO — ELEVATION & SHADOWS\n   Warm-tinted shadows (sand/earth based, never pure black) so\n   raised surfaces feel sunlit rather than clinical.\n   ============================================================ */\n\n:root {\n  --shadow-xs:  0 1px 2px rgba(43, 39, 30, 0.06);\n  --shadow-sm:  0 1px 3px rgba(43, 39, 30, 0.08), 0 1px 2px rgba(43, 39, 30, 0.06);\n  --shadow-md:  0 4px 10px -2px rgba(43, 39, 30, 0.10), 0 2px 4px -2px rgba(43, 39, 30, 0.06);\n  --shadow-lg:  0 12px 24px -6px rgba(43, 39, 30, 0.14), 0 4px 8px -4px rgba(43, 39, 30, 0.08);\n  --shadow-xl:  0 24px 48px -12px rgba(43, 39, 30, 0.20), 0 8px 16px -8px rgba(43, 39, 30, 0.10);\n\n  /* Inset for sunken fields / map wells */\n  --shadow-inset: inset 0 1px 2px rgba(43, 39, 30, 0.10);\n\n  /* Focus ring as a layered shadow */\n  --ring: 0 0 0 3px var(--focus-ring);\n\n  /* Card lift on hover */\n  --shadow-card:       var(--shadow-sm);\n  --shadow-card-hover: var(--shadow-md);\n\n  /* Floating map controls / FAB */\n  --shadow-float: 0 6px 16px -4px rgba(13, 43, 32, 0.24), 0 2px 6px -2px rgba(13, 43, 32, 0.16);\n}\n\n/* ============================================================\n   SENDERO — BASE / RESET\n   Minimal, opinionated defaults so specimens & kits inherit the\n   brand without per-file boilerplate.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--text-strong);\n  margin: 0;\n  text-wrap: balance;\n}\n\np { text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\ncode, kbd, samp { font-family: var(--font-mono); }\n\n/* Shared helpers used across specimens */\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.mono-stat {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: var(--tracking-snug);\n}\n\n::selection { background: var(--toronja-200); color: var(--arena-900); }\n\n<\/style>\n  <script src=\"5e50196a-aae8-4471-83e2-9f7542965769\"><\/script>\n  <style>\n    html, body { margin: 0; padding: 0; background: #FAF7F1; }\n    a { color: #934425; }\n    a:hover { color: #9C3F09; }\n    ::selection { background: rgba(239,171,61,0.35); }\n    select:focus, input:focus, button:focus-visible { outline: 2px solid #EFAB3D; outline-offset: 1px; }\n    @keyframes pwrPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }\n    @keyframes lcdBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }\n    @media print { .no-print { display: none !important; } html, body { background: #FFFFFF !important; } }\n    *::-webkit-scrollbar { width: 10px; height: 10px; }\n    *::-webkit-scrollbar-track { background: #F2ECE1; }\n    *::-webkit-scrollbar-thumb { background: #98A1AC; border-radius: 5px; border: 2px solid #CDD3D9; }\n    *::-webkit-scrollbar-thumb:hover { background: #7E8894; }\n  <\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; display: flex; flex-direction: column; font-family: 'Hanken Grotesk', sans-serif; color: #2B271E; background: #FA r-color: #C4681E; color: #C4681E;\">{{ s.name }}<\/button>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/sc-if>\n          <\/sc-if>\n          <sc-if value=\"{{ hasDo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: #F8F5EE; border: 1px solid #D2C5AF; border-radius: 6px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px;\">\n                <span style=\"font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em; color: #934425;\">DO-FILE<\/span>\n                <span style=\"font-family: 'Space Mono', monospace; font-size: 10px; color: #5D5648;\">QUEUED COMMANDS RUN IN ORDER — LIKE A STATA DO-FILE<\/span>\n                <div style=\"flex: 1;\"><\/div>\n                <button sc-camel-on-click=\"{{ doRun }}\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; color: #FFFFFF; background: #C4681E; border: 1px solid #A3540F; border-radius: 6px; padding: 5px 14px; cursor: pointer;\" style-active=\"transform: translateY(1px);\">Do ▶<\/button>\n                <button sc-camel-on-click=\"{{ doClear }}\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; color: #B0342C; background: none; border: 1px solid #E6B59A; border-radius: 6px; padding: 5px 12px; cursor: pointer;\">Clear<\/button>\n              <\/div>\n              <sc-for list=\"{{ doRows }}\" as=\"q\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; align-items: center; gap: 8px;\">\n                  <span style=\"flex: 1; font-family: 'Space Mono', monospace; font-size: 11.5px; color: #226578; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ q.text }}<\/span>\n \/div>\n        <span style=\"overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch;\">{{ sbVar }}<\/span>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n\n  <footer style=\"border-top: 1px solid #C3CAD1; padding: 10px 24px; display: flex; justify-content: center; gap: 20px; font-family: 'Space Mono', monospace; font-size: 10px; color: #7E7563; letter-spacing: 0.1em;\">\n    <span>CIDIGIMI26 · v2.6<\/span><span>·<\/span><span>ALL COMPUTATION LOCAL<\/span><span>·<\/span><span>CSV / TSV / STATA DTA<\/span>\n  <\/footer>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;decimals&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0, &quot;max&quot;: 4, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Output&quot;}, &quot;alpha&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;0.05&quot;, &quot;0.01&quot;, &quot;0.10&quot;], &quot;default&quot;: &quot;0.05&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Statistics&quot;}, &quot;showInterpretation&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Output&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'upload', dragging: false, parsing: false, parsingName: '', progress: 0, error: '',\n    fileName: '', nRows: 0, cols: [], treat: {},\n    tab: 'one', search: '',\n    weightVar: '', weightAuto: false, missingCodes: '', missingDraft: '', pk: null, pq: '', autoScreen: true,\n    exploreVar: '', xVar: '', yVar: '', depVar: '', predictors: [], regModel: 'ols', alphaSel: '', chartColor: '',\n    guideOn: true, dhOpen: false, dhQ1: '', dhQ2: '',\n    conVerb: null, conSlots: [], conActive: -1, conQ: '', conLog: [], conSig: '', dialect: 'stata',\n    genName: '', genExpr: '', genErr: '', rcVar: '', rcName: '', rcErr: '', rcRows: [{ f: '', t: '', l: '' }, { f: '', t: '', l: '' }, { f: '', t: '', l: '' }],\n    rnFrom: '', rnTo: '', rnErr: '', hiddenVars: [], flt: null, fltV: '', fltOp: '>', fltVal: '', fltErr: '', genTags: {},\n    plotKind: 'hist', pX: '', pY: '', pG: '', pGSel: [], pT0: '', pT1: '', crItems: [], crRes: null, crErr: '', mu: '', tt1: null, mxItems: [], menu: '',\n    browseMode: 'data', vlVar: '', vlPairs: [], doQueue: [], reportMode: false, exOpen: false,\n    copied: ''\n  };\n  _memo = {}; _svgs = {};\n\n  componentDidMount() {\n    this._engineP = import(window.__resources.engine).then(E => { this._E = E; this.forceUpdate(); return E; });\n    window.__datalabIngest = (buf, name) => this.ingest(buf, name);\n    if (this.state.screen === 'work' && !this._raw) this.setState({ screen: 'upload', cols: [], parsing: false, error: '' });\n  }\n\n  componentDidUpdate() {\n    if (!this._raw || !this._E) return;\n    const d = this.descFor();\n    const sig = d ? JSON.stringify(d) + '|a' + this.alpha() : '';\n    if (sig !== this.state.conSig) {\n      const upd = { conSig: sig };\n      if (d) { let res = '', tbl = ''; try { res = this.resFor(d); tbl = this.tableFor(d); } catch (e) {} upd.conLog = [...this.state.conLog, { ...d, res, tbl }].slice(-60); }\n      this.setState(upd);\n    }\n  }\n  descFor() {\n    const S = this.state;\n    if (S.screen !== 'work' || !S.cols.length) return null;\n    const w = S.weightVar || '';\n    if (S.tab === 'one' && S.exploreVar) {\n      const m = this.effMeta(S.exploreVar); if (!m) return null;\n      return m.treatAs === 'numeric' ? { t: 'sum', x: S.exploreVar, w } : { t: 'tab1', x: S.exploreVar, w };\n    }\n    if (S.tab === 'two' && S.xVar && S.yVar && S.xVar !== S.yVar) {\n      const xm = this.effMeta(S.xVar), ym = this.effMeta(S.yVar); if (!xm || !ym) return null;\n      const xN = xm.treatAs === 'numeric', yN = ym.treatAs === 'numeric';\n      if (xN && yN) return { t: 'corr', x: S.xVar, y: S.yVar, w };\n      if (!xN && !yN) return { t: 'ct', x: S.xVar, y: S.yVar, w };\n      const g = xN ? S.yVar : S.xVar, y = xN ? S.xVar : S.yVar;\n      return { t: this.effMeta(g).distinct === 2 ? 'ttest' : 'anova', y, g, w };\n    }\n    if (S.tab === 'reg' && S.depVar && S.predictors.length) {\n      return { t: 'reg', m: S.regModel, y: S.depVar, xs: S.predictors.map(p => ({ n: p, c: this.effMeta(p) ? this.effMeta(p).treatAs === 'categorical' : false })), w };\n    }\n    if (S.tab === 'plots' && S.pX) {\n      const needY = ['scatter', 'gbox', 'stack', 'line'].includes(S.plotKind);\n      if (!needY || S.pY) return Object.assign({ t: 'plot', kind: S.plotKind, x: S.pX, y: needY ? S.pY : '', w }, S.plotKind === 'line' && S.pG ? { g: S.pG, gs: [...(S.pGSel || [])] } : {}, S.plotKind === 'line' && (S.pT0 || S.pT1) ? { t0: S.pT0, t1: S.pT1 } : {});\n    }\n    return null;\n  }\n  cmdText(d, dial) {\n    if (d.t === 'describe') return dial === 'stata' ? 'describe' : 'str(df)';\n    if (d.t === 'codebook') return dial === 'stata' ? 'codebook ' + d.x : 'summary(df$' + d.x + ')';\n    if (d.t === 'gen') return dial === 'stata' ? 'generate ' + d.name + ' = ' + d.expr : 'df$' + d.name + ' <- with(df, ' + d.expr + ')';\n    if (d.t === 'recode') return dial === 'stata'\n      ? 'recode ' + d.v + ' ' + d.rows.map((r, i) => '(' + r.f + '/' + r.t + '=' + (i + 1) + ' \"' + r.l + '\")').join(' ') + ', gen(' + d.name + ')'\n      : 'df$' + d.name + ' <- cut(df$' + d.v + ', c(' + [d.rows[0].f, ...d.rows.map(r => r.t)].join(', ') + '), labels = c(' + d.rows.map(r => '\"' + r.l + '\"').join(', ') + '), include.lowest = TRUE)';\n    if (d.t === 'rename') return dial === 'stata' ? 'rename ' + d.from + ' ' + d.to : 'names(df)[names(df) == \"' + d.from + '\"] <- \"' + d.to + '\"';\n    if (d.t === 'dropv') return dial === 'stata' ? 'drop ' + d.list.join(' ') : d.list.map(v => 'df$' + v + ' <- NULL').join('; ');\n    if (d.t === 'restorev') return dial === 'stata' ? '* restored hidden variables (data was never deleted)' : '# restored hidden variables (data was never deleted)';\n    if (d.t === 'filter') { const q = d.cat ? '\"' + d.val + '\"' : d.val; return dial === 'stata' ? 'keep if ' + d.v + ' ' + d.op + ' ' + q : 'df <- subset(df, ' + d.v + ' ' + d.op + ' ' + q + ')'; }\n    if (d.t === 'unfilter') return dial === 'stata' ? '* filter cleared — all rows restored' : '# filter cleared — all rows restored';\n    if (d.t === 'cralpha') return dial === 'stata' ? 'alpha ' + d.items.join(' ') + ', asis' : 'psych::alpha(df[, c(' + d.items.map(v => '\"' + v + '\"').join(', ') + ')])';\n    if (d.t === 'ttest1') return dial === 'stata' ? 'ttest ' + d.x + ' == ' + d.mu : 't.test(df$' + d.x + ', mu = ' + d.mu + ')';\n    if (d.t === 'ttestp') return dial === 'stata' ? 'ttest ' + d.x + ' == ' + d.y : 't.test(df$' + d.x + ', df$' + d.y + ', paired = TRUE)';\n    if (d.t === 'pwcorr') return dial === 'stata' ? 'pwcorr ' + d.items.join(' ') + ', sig obs' : 'cor(df[, c(' + d.items.map(v => '\"' + v + '\"').join(', ') + ')], use = \"pairwise\")';\n    if (d.t === 'plot') {\n      const k = d.kind;\n      if (k === 'line') {\n        const inL = d.g && d.gs && d.gs.length ? d.gs.map(s => '\"' + s + '\"') : null;\n        const rng = (d.t0 || d.t1) ? [d.t0 ? d.x + ' >= ' + d.t0 : '', d.t1 ? d.x + ' <= ' + d.t1 : ''].filter(Boolean) : [];\n        if (dial === 'stata') return d.g ? (inL ? 'xtline ' + d.y + ' if inlist(' + d.g + ', ' + inL.join(', ') + ')' + (rng.length ? ' & ' + rng.join(' & ') : '') + ', t(' + d.x + ') i(' + d.g + ') overlay' : 'collapse (mean) ' + d.y + (rng.length ? ' if ' + rng.join(' & ') : '') + ', by(' + d.x + ')  // then: twoway line ' + d.y + ' ' + d.x) : 'twoway line ' + d.y + ' ' + d.x + (rng.length ? ' if ' + rng.join(' & ') : '') + ', sort';\n        return d.g ? (inL ? 'ggplot(subset(df, ' + d.g + ' %in% c(' + inL.join(', ') + ')), aes(' + d.x + ', ' + d.y + ', colour = ' + d.g + ')) + geom_line()' : 'aggregate(' + d.y + ' ~ ' + d.x + ', df, mean) |> plot(type = \"l\")') : 'plot(' + d.y + ' ~ ' + d.x + ', df, type = \"l\")';\n      }\n      if (dial === 'stata') return k === 'hist' ? 'histogram ' + d.x : k === 'bar' ? 'graph hbar, over(' + d.x + ')' : k === 'box' ? 'graph box ' + d.x : k === 'scatter' ? 'twoway (scatter ' + d.y + ' ' + d.x + ') (lfit ' + d.y + ' ' + d.x + ')' : k === 'gbox' ? 'graph box ' + d.y + ', over(' + d.x + ')' : 'graph bar, over(' + d.y + ') over(' + d.x + ') stack percent';\n      return k === 'hist' ? 'hist(df$' + d.x + ')' : k === 'bar' ? 'barplot(table(df$' + d.x + '))' : k === 'box' ? 'boxplot(df$' + d.x + ')' : k === 'scatter' ? 'plot(df$' + d.x + ', df$' + d.y + '); abline(lm(' + d.y + ' ~ ' + d.x + ', data = df))' : k === 'gbox' ? 'boxplot(' + d.y + ' ~ ' + d.x + ', data = df)' : 'mosaicplot(table(df$' + d.y + ', df$' + d.x + '))';\n    }\n    if (dial === 'stata') {\n      const aw = d.w ? ' [aw=' + d.w + ']' : '';\n      if (d.t === 'sum') return 'summarize ' + d.x + aw;\n      if (d.t === 'tab1') return 'tabulate ' + d.x + aw;\n      if (d.t === 'ct') return 'tabulate ' + d.y + ' ' + d.x + aw + ', col';\n      if (d.t === 'corr') return 'pwcorr ' + d.x + ' ' + d.y + aw + ', sig obs';\n      if (d.t === 'ttest') return 'ttest ' + d.y + ', by(' + d.g + ') unequal';\n      if (d.t === 'anova') return 'oneway ' + d.y + ' ' + d.g + aw;\n      if (d.t === 'reg') {\n        const verb = d.m === 'ols' ? 'regress' : d.m === 'logistic' ? 'logit' : d.m === 'ologit' ? 'ologit' : 'poisson';\n        return verb + ' ' + d.y + ' ' + d.xs.map(x => x.c ? 'i.' + x.n : x.n).join(' ') + (d.w ? ' [pw=' + d.w + ']' : '');\n      }\n    } else {\n      const wp = d.w ? ', weights = ' + d.w : '';\n      if (d.t === 'sum') return 'summary(df$' + d.x + ')';\n      if (d.t === 'tab1') return 'table(df$' + d.x + ')';\n      if (d.t === 'ct') return 'prop.table(table(df$' + d.y + ', df$' + d.x + '), margin = 2)';\n      if (d.t === 'corr') return 'cor.test(df$' + d.x + ', df$' + d.y + ')';\n      if (d.t === 'ttest') return 't.test(' + d.y + ' ~ ' + d.g + ', data = df)';\n      if (d.t === 'anova') return 'summary(aov(' + d.y + ' ~ ' + d.g + ', data = df))';\n      if (d.t === 'reg') {\n        const f = d.y + ' ~ ' + d.xs.map(x => x.c ? 'factor(' + x.n + ')' : x.n).join(' + ');\n        if (d.m === 'ols') return 'summary(lm(' + f + ', data = df' + wp + '))';\n        if (d.m === 'ologit') return 'summary(MASS::polr(factor(' + d.y + ') ~ ' + d.xs.map(x => x.c ? 'factor(' + x.n + ')' : x.n).join(' + ') + ', data = df, Hess = TRUE))';\n        return 'summary(glm(' + f + ', family = ' + (d.m === 'logistic' ? 'binomial' : 'poisson') + ', data = df' + wp + '))';\n      }\n    }\n    return '';\n  }\n  validName(nm) {\n    if (!/^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(nm)) return 'name must start with a letter, letters/digits/_ only (max 32)';\n    if (this._raw.names.includes(nm)) return '\"' + nm + '\" already exists';\n    return null;\n  }\n  addDerivedCol(name, col, label, tag) {\n    const raw = this._raw;\n    raw.names.push(name); raw.labels.push(label); raw.cols.push(col);\n    const meta = this._E.profileCol(raw, raw.names.length - 1, this.state.autoScreen);\n    this.setState(s => ({ cols: [...s.cols, meta], genTags: { ...s.genTags, [name]: tag } }));\n  }\n  doGenerate() {\n    const S = this.state, E = this._E, name = S.genName.trim(), expr = S.genExpr.trim();\n    const bad = name ? this.validName(name) : 'enter a new variable name';\n    if (bad) return this.setState({ genErr: bad });\n    if (!expr) return this.setState({ genErr: 'enter a formula, e.g. income / population' });\n    const p = E.parseFormula(expr, this._raw.names);\n    if (p.error) return this.setState({ genErr: p.error });\n    const arrs = {};\n    for (const v of p.vars) {\n      const cv = this.valsCore(v);\n      if (cv.kind !== 'num') return this.setState({ genErr: '\"' + v + '\" is categorical — formulas need numeric variables' });\n      arrs[v] = cv.a;\n    }
