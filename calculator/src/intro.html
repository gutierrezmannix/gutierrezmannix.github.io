    <section data-screen-label="Load bay" class="gi">
      <div class="gi-wrap">
        <div class="gi-drop" sc-camel-on-click="{{ introPick }}" sc-camel-on-drag-over="{{ onDragOver }}" sc-camel-on-drag-leave="{{ onDragLeave }}" sc-camel-on-drop="{{ introDrop }}">
          <div class="gi-dropicon"><svg width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2E7D58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m8 11 4 4 4-4"></path><path d="M4 21h16"></path></svg></div>
          <h1 class="gi-droptitle">Drag a data file here</h1><div class="tl-formats">CSV · TSV · Excel (.xlsx, .xls) · Stata (.dta) · SPSS (.sav)</div>
          <button type="button" class="gi-browse">Browse files</button>
          <button type="button" class="gi-new" sc-camel-on-click="{{ newDatasetLink }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2E7D58" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10 H21 M9 4 V20"></path></svg>Create your own dataset</button>
          <sc-if value="{{ dragging }}" hint-placeholder-val="{{ false }}">
            <div class="gi-release">RELEASE TO LOAD</div>
          </sc-if>
        </div>

        <sc-if value="{{ parsing }}" hint-placeholder-val="{{ false }}">
          <div style="background: var(--cFFFFFF, #FFFFFF); border: 1px solid var(--cD2C5AF, #D2C5AF); border-radius: 9px; padding: 10px 14px; box-shadow: inset 0 1px 2px rgba(43,39,30,0.06); display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; font-family: var(--fMono, 'Space Mono', monospace); font-size: 12px; color: var(--c194F39, #194F39); letter-spacing: 0.08em;">
              <span>{{ parsingName }} · {{ parseStage }}<span style="animation: lcdBlink 1s steps(2) infinite;">_</span></span>
              <span>{{ progressPct }} <button class="mf-axbtn" sc-camel-on-click="{{ cancelLoad }}" title="Stop loading this file" style="margin-left: 8px;">Cancel</button></span>
            </div>
            <div style="height: 14px; background: var(--cF2ECE1, #F2ECE1); border: 1px solid var(--cD2C5AF, #D2C5AF); border-radius: 9px; overflow: hidden;">
              <div style="height: 100%; width: {{ progressPct }}; background: var(--c2E7D58, #2E7D58); "></div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div style="background: var(--cFDF3E2, #FDF3E2); border: 1px solid var(--cF5C778, #F5C778); border-radius: 9px; padding: 9px 14px; font-family: var(--fMono, 'Space Mono', monospace); font-size: 13px; color: var(--c9C4A08, #9C4A08);">ERR // {{ error }}</div>
        </sc-if>

        <sc-if value="{{ hasIntroRecent }}" hint-placeholder-val="{{ false }}">
          <section class="gi-sec" aria-label="Continue where you left off">
            <h2 class="gi-h2">Continue where you left off</h2>
            <div class="gi-recent">
              <sc-for list="{{ introRecent }}" as="r" hint-placeholder-count="2">
                <div class="gi-rcard">
                  <div class="gi-rtext"><div class="gi-rname">{{ r.name }}</div><div class="gi-rsub">{{ r.sub }}</div></div>
                  <sc-if value="{{ r.canRestore }}" hint-placeholder-val="{{ true }}"><button type="button" class="gi-cont" sc-camel-on-click="{{ r.restore }}">Continue</button></sc-if>
                  <button type="button" class="gi-remove" sc-camel-on-click="{{ r.discard }}" title="Remove this unsaved work from this computer">Remove</button>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-if>
      </div>
    </section>
